# =============================================================================
# Rollin 前端静态交付（容器内 nginx，监听 80）
#
# 职责只有一件事：交付 SPA 静态资源 + SPA fallback。
# /api 反代与双域名隔离由边缘 nginx 负责（deploy/nginx.conf.example），
# 本文件不做任何 API 转发——请求打到容器 80 端口的 /api/* 时按 404 兜底。
#
# SPA 路由（src/router/paths.ts），全部依赖下方 try_files 兜底实现深链直开/刷新：
#   /o/:token                              候选人 Offer 页（候选人域名入口）
#   /login /login/platform /invite/:token  登录与邀请激活（管理域名）
#   /platform/* /a/:activitySlug/*         平台后台与活动工作区（管理域名）
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite 指纹产物：内容不变即 URL 不变，可长缓存（immutable 交给边缘层透传）
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # index.html 不缓存（expires -1 同时给出过期时间与 no-cache）：发版后浏览器立即拿到新版本
    location = /index.html {
        expires -1;
    }

    # SPA fallback：未命中文件/目录的路径一律回退 index.html，由前端路由接管。
    # /o/:token、/invite/:token、/a/:slug/... 深链直开都经此生效。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源 gzip（构建产物本身不含预压缩）
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
